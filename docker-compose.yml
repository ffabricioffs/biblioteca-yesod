# Sobe o PostgreSQL e a aplicação juntos:  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: biblio
      POSTGRES_PASSWORD: biblio
      POSTGRES_DB: biblioteca
    # Sem "ports": o banco só é acessível pelo app, dentro do Docker.
    # Assim não conflita com um PostgreSQL já instalado no computador.
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblio -d biblioteca"]
      interval: 3s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://biblio:biblio@db:5432/biblioteca
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  dados:
